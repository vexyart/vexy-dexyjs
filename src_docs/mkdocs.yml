# this_file: src_docs/mkdocs.yml
site_name: DexyJS
site_description: Browser DOM preprocessor that converts any web page into reveal.js-compatible slides.
site_url: https://vexy.dev/vexy-dexyjs/
repo_url: https://github.com/vexyart/vexy-dexyjs
repo_name: GitHub
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - fly
  - search
extra:
  fly:
    chrome: none
    hue: indigo
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - How it works: how-it-works.md
  - Frameworks: frameworks.md
  - API reference: api.md
  - Chrome extension: extension.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
